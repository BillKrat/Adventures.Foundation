name: Publish packages to nuget.org

# Triggered by pushing a tag like "v0.1.0" - deliberately not on every push to main, so a build
# on main doesn't accidentally publish a new public package version. Requires a NUGET_API_KEY
# repository secret (from nuget.org > API Keys) - this job will fail at the push step until
# that's configured; build/test still runs and reports success/failure independently of it.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Adventures.Foundation.slnx

      - name: Build
        run: dotnet build Adventures.Foundation.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Adventures.Foundation.slnx -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Adventures.Security -c Release -o ./nupkgs --no-build
          dotnet pack src/Adventures.Data -c Release -o ./nupkgs --no-build

      - name: Push to nuget.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
