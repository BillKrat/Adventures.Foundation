name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Adventures.Foundation.slnx

      - name: Build
        run: dotnet build Adventures.Foundation.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Adventures.Foundation.slnx -c Release --no-build
